services:
  postgres:
    image: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  server:
    image: booking-app-backend-dev
    build:
      context: .
      dockerfile: dev.Dockerfile
    volumes:
      - ./:/user/src/app
    ports:
      - 4000:4000
    container_name: booking-app-backend-dev
    environment:
      DATABASE_URL: postgres://postgres:mysecretpassword@postgres:5432/postgres
    depends_on:
      - postgres
