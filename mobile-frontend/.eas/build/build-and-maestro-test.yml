build:
  name: Create a build and run Maestro tests on it
  steps:
    - eas/build
    - eas/maestro_test:
        inputs:
          flow_path: |
            maestro/login.yaml
            maestro/building_filter.yaml
            maestro/cancel_booking.yaml
            maestro/date_time_picker.yaml
            maestro/home_screen.yaml
            maestro/modify_booking.yaml
            maestro/room_view.yaml
            maestro/tools_filter.yaml
            maestro/type_filter.yaml