appId: ${APP_ID}
---
- runFlow: login.yaml
- tapOn: 'rach-100  Sergei Rachmaninoff Building  Available'
- tapOn: 'Reserve'
- tapOn:
    point: "92%,13%"
- tapOn: "06:00:00"
- tapOn: 'Confirm'
- assertVisible: "Booking Details"
- tapOn: 'Reserve'
- assertVisible: 'Booking created successfully.'
- assertVisible: 'rach-100  Sergei Rachmaninoff Building  Available'
- tapOn: 'My Calendar'
- assertVisible: 'rach-100'
- runScript: ../src/scripts/getTomorrowDate.js
- assertVisible: "${output.getTomorrowDate.dotFormat} at 6.00 - ${output.getTomorrowDate.dotFormat} at 7.00"
- assertVisible: " Modify"
- tapOn: " Modify"
- assertVisible: "Reservation from Booking App"
- longPressOn:
    point: "70%,33%"
- tapOn: 'Select All'
- eraseText
- inputText: 'New Title'
- hideKeyboard
- tapOn: 'Save'
- assertVisible: 'Booking updated successfully.'
- assertVisible: 'My Calendar'
- tapOn: 'My Calendar'
- assertVisible: "New Title"
- tapOn: " Modify"
- tapOn: "${output.getTomorrowDate.spaceFormat} at 06:00"
- assertVisible: ${output.getTomorrowDate.spaceFormat}
- tapOn: 09:00:00
- tapOn: "Confirm"
- assertVisible: "Starts: ${output.getTomorrowDate.commaFormat} at 9:00 AM"
- assertVisible: "Ends: ${output.getTomorrowDate.commaFormat} at 10:00 AM"
- tapOn: "Save"
- assertVisible: 'Booking updated successfully.'
- assertVisible: 'My Calendar'
- tapOn: 'My Calendar'
- assertVisible: "${output.getTomorrowDate.dotFormat} at 9.00 - ${output.getTomorrowDate.dotFormat} at 10.00"