appId: ${APP_ID}
---
- runFlow: login.yaml
- assertVisible: 'rach-100  Sergei Rachmaninoff Building  Available'
- tapOn: 'rach-100  Sergei Rachmaninoff Building  Available'
- assertVisible: 'Reserve'
- tapOn: 'Reserve'
- runScript: ../src/scripts/getTodayDate.js
- assertVisible: ${output.getTodayDate.spaceFormat}
- assertVisible: "06:00:00"
- scrollUntilVisible:
    element: '21:00:00'
- assertVisible: 'Confirm'
- tapOn: 'Confirm'
- assertVisible: "Empty booking"
- tapOn: 'OK'
- tapOn: "21:00:00"
- tapOn: 'Confirm'
- assertVisible: "Booking Details"
- assertVisible: "Room: rach-100"
- assertVisible: "Starts: ${output.getTodayDate.commaFormat} at 9:00 PM"
- assertVisible: "Ends: ${output.getTodayDate.commaFormat} at 10:00 PM"
- tapOn: 'Reserve'
- assertVisible: 'Booking created successfully.'
- assertVisible: 'rach-100  Sergei Rachmaninoff Building  Available'
- tapOn: 'rach-100  Sergei Rachmaninoff Building  Available'
- tapOn: 'Reserve'
- scrollUntilVisible:
    element: '21:00:00 Reservation from Booking App'
- assertVisible: 'Elena Demina'