appId: ${APP_ID}
---
- runFlow: login.yaml
- assertVisible: 'rach-100  Sergei Rachmaninoff Building  Available'
- tapOn: 'rach-100  Sergei Rachmaninoff Building  Available'
- assertVisible: 'rach-100'
- assertVisible: 'Reserve'
- scrollUntilVisible:
    element: 'Show Upcoming Reservations'
- tapOn: 'Show Upcoming Reservations'
- assertVisible: 'You have no upcoming bookings.'
- tapOn: 'Close'
- scrollUntilVisible:
    element: 'Reserve'
    direction: UP
- tapOn: 'Reserve'
- tapOn:
    point: "92%,13%"
- tapOn: "06:00:00"
- tapOn: 'Confirm'
- assertVisible: "Booking Details"
- tapOn: 'Reserve'
- assertVisible: 'Booking created successfully.'
- assertVisible: 'rach-100  Sergei Rachmaninoff Building  Available'
- tapOn: 'rach-100  Sergei Rachmaninoff Building  Available'
- scrollUntilVisible:
    element: 'Show Upcoming Reservations'
- tapOn: 'Show Upcoming Reservations'
- assertVisible: 'Reservation from Booking App'
- assertVisible: 'rach-100'
- assertVisible: '.*6.00.*'
- assertVisible: '.*7.00.*'