type Venue {
  id: ID!
  code: String!
  name: String!
}

type Query {
  allVenues: [Venue!]!
  findVenue(id: ID!): Venue
  findVenueByName(name: String!): [Venue!]!
  findVenuesByDepartment(departmentId: ID!): [Venue!]!
}

type Mutation {
  createVenue(code: String!, name: String!): Venue!
  updateVenue(id: ID!, code: String, name: String): Venue!
  deleteVenue(id: ID!): Boolean!
}