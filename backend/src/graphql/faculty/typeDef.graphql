type Faculty {
  id: ID!
  name: String
  departments: [Department!]!
}

type Query {
  allFaculties: [Faculty!]!
  findFaculty(id: ID!): Faculty
  findFacultyByName(name: String!): [Faculty!]!
}

type Mutation {
  createFaculty(name: String!): Faculty!
  updateFaculty(id: ID!, name: String!): Faculty!
  addDepartmentToFaculty(facultyId: ID!, departmentId: ID!): Faculty!
  removeDepartmentFromFaculty(facultyId: ID!, departmentId: ID!): Faculty!
  deleteFaculty(id: ID!): Boolean!
}