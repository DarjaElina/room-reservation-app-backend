scalar Date

type RoomConnection {
  totalCount: Int!
  edges: [RoomEdge!]!
  pageInfo: PageInfo!
}

type RoomEdge {
  node: Room!
  cursor: String!
}

type PageInfo {
  hasPreviousPage: Boolean!
  hasNextPage: Boolean!
  startCursor: String
  endCursor: String
}

enum RoomType {
  PRACTICE_ROOM
  CONCERT_HALL
  ADMINISTRATIVE_SPACE
  CLASSROOM
  STUDIO
  LIBRARY
  MEETING_ROOM
  THEATER
}

type Room {
  id: ID!
  venue: Venue!
  code: String!
  type: RoomType!
  size: Int!
  equipment: [Equipment!]!
  pictureUrl: String
  isBookable: Boolean!
  department: Department
  isFree: Boolean
  description: String!
  isFavorite: Boolean
}

type RoomResponse {
  success: Boolean!
  message: String!
  isFavoriteNow: Boolean
  id: ID
}

type Query {
  findRoom(roomId: ID!): Room
  rooms(
    startsAt: Date
    endsAt: Date
    venueIds: [ID!]
    roomTypes: [RoomType!]
    equipmentIds: [ID!]
    isBookable: Boolean
    searchKeyword: String
    after: String
    first: Int
    showFavorites: Boolean
  ): RoomConnection!
}

type Mutation {
  toggleFavorite(roomId: ID!): RoomResponse!
}
