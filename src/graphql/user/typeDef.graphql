enum UserRole {
  ADMIN
  STUDENT
  TEACHER
  MANAGER
}

enum UserStatus {
  ACTIVE
  PENDING
  DISABLED
}

type User {
  id: ID!
  givenName: String!
  middleName: String
  familyName: String!
  username: String!
  email: String!
  role: UserRole!
  status: UserStatus!
  department: Department!
  userNumber: Int!
}

input UserInput {
  givenName: String!
  middleName: String
  familyName: String!
  email: String!
  role: UserRole!
  status: UserStatus!
  departmentId: ID!
}

enum TokenType {
  ACTIVATION
  PASSWORD_RESET
}

type AccessToken {
  value: String!
}

type ActivationToken {
  token: String!
  expires_at: Date!
  used: Boolean!
}

type Query {
  currentUser: User
  checkActivationToken(activationToken: String!): Boolean!
}

type UserResponse {
  success: Boolean!
  message: String!
  id: ID
}

type Mutation {
  authenticate(username: String!, password: String!): AccessToken
  activateUser(activationToken: String!, newPassword: String!): UserResponse!
  signupRequest(userInput: UserInput!): UserResponse!
}
